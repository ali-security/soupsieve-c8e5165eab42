name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest -k expression to narrow the test run'
        required: false
        default: ''

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-latest, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        # `linux_python_version` pins the Linux legs to an exact CPython patch.
        # The 2025 stdlib `html.parser` security hardening (backported into
        # 3.9.24+/3.10.19+/3.11.14+) changed rawtext/`iframe` parsing and breaks
        # 8 iframe tests, so Linux runs the patch releases that were current at
        # soupsieve 2.4.1's 2023-04-16 release. Windows keeps its unpinned
        # values: setup-python is already frozen there on pre-hardening binary
        # installer builds (3.9.13/3.10.11/3.11.9).
        include:
          - tox-env: py37
            python-version: 3.7
            linux_python_version: '3.7.17'
          - tox-env: py38
            python-version: 3.8
            linux_python_version: '3.8.16'
          - tox-env: py39
            python-version: 3.9
            linux_python_version: '3.9.16'
          - tox-env: py310
            python-version: '3.10'
            linux_python_version: '3.10.10'
          - tox-env: py311
            python-version: '3.11'
            linux_python_version: '3.11.3'
          - tox-env: nolxml
            python-version: '3.11'
            linux_python_version: '3.11.3'
          - tox-env: nohtml5lib
            python-version: '3.10'
            linux_python_version: '3.10.10'
          - platform: ubuntu-22.04
            tox-env: py37
            python-version: 3.7
            linux_python_version: '3.7.17'
        exclude:
          - platform: ubuntu-latest
            tox-env: py37
        # (the include: list above already maps tox-env -> python-version)

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.platform }}

    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ runner.os == 'Linux' && matrix.linux_python_version || matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade --index-url 'https://:2023-04-16T23:56:46@time-machines-pypi.sealsecurity.io/' pip setuptools build tox coverage
    - name: Test
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          python -m tox -- -k "${{ inputs.test-filter }}"
        else
          python -m tox
        fi
      shell: bash

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Package
        run: |
          pip install --upgrade --index-url 'https://:2023-04-16T23:56:46@time-machines-pypi.sealsecurity.io/' build
          pip install --index-url 'https://:2023-04-16T23:56:46@time-machines-pypi.sealsecurity.io/' 'hatchling==1.14.0'
          python -m build -s -w --no-isolation
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
